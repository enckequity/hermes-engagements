name: engagements
version: 1.0.0-rc1
manifest_version: 2
requires_hermes: ">=0.22.3"
description: A client and project notebook. Add a client or project by pasting notes, approve the draft, and every agent working for that client can look up who to contact, how they like to work and where the files live.
author: Hopewell MSP
license: MIT
python_dependencies:
  - "pyyaml>=6,<7"
provides_tools:
  - engagements_find
  - engagements_bind
  - engagements_context
  - engagements_create
  - engagements_update
provides_hooks:
  - pre_llm_call
  - post_compaction
  - on_session_reset
  - on_session_delete
config_schema:
  library_root:
    type: str
    default: ""
    description: "Library folder. Blank uses <HERMES_HOME>/plugin-data/engagements/library. Point several profiles at one absolute path to share it."
  labels:
    type: dict
    default: {client: Client, project: Project}
    description: "Display words only (for example Account/Campaign). Keys: client, project."
  auto_bind:
    type: bool
    default: true
    description: "Bind a session automatically when its working directory is inside exactly one project's local locations (CLI, TUI and Desktop)."
  banner:
    type: bool
    default: true
    description: "Tell the model which client the session is bound to when that changes."
  refuse_secrets:
    type: bool
    default: false
    description: "Refuse a create or update whose text looks like it holds a credential, instead of saving it with a warning."
  restrict_commands:
    type: bool
    default: false
    description: "Let only local sessions and the senders in command_senders use /client and /engagements."
  command_senders:
    type: list
    default: []
    description: "Messaging senders allowed to use /client and /engagements when restrict_commands is on, as platform:user_id."
